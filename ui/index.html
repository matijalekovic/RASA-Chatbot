<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>1PAX — Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f3f1;
      --surface:  #ffffff;
      --border:   #e3e1dc;
      --text:     #111111;
      --muted:    #8a8580;
      --radius:   16px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 780px;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      background: var(--bg);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 0.07em; }
    .header-sub { font-size: 12px; color: var(--muted); min-width: 0; }
    .status-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; margin-left: 8px; flex-shrink: 0; }

    /* ── Language selector ── */
    .lang-selector { display: flex; gap: 3px; margin-left: auto; }
    .lang-btn {
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      transition: all 0.1s;
      line-height: 1.6;
    }
    .lang-btn:hover  { border-color: #aaa; color: var(--text); }
    .lang-btn.active { background: #111; color: #fff; border-color: #111; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 0;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      animation: fadeIn 0.14s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; align-items: flex-end; margin-top: 10px; }
    .message.bot  { align-self: flex-start; align-items: flex-start; }
    .message.bot + .message.bot { margin-top: 2px; }
    .message.bot + .message.user,
    .message.user + .message.bot { margin-top: 14px; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #111;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.bot + .message.bot .bubble { border-top-left-radius: 4px; }

    /* ── Markdown — base ── */
    .bubble p { margin: 0 0 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; color: var(--muted); }
    .message.user .bubble em { color: rgba(255,255,255,0.6); }
    .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; opacity: 0.85; }
    .bubble a:hover { opacity: 1; }
    .bubble-image {
      display: block;
      width: 100%;
      max-height: 280px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .bubble-image:first-child { margin-top: 0; }

    /* Section headers — standalone **Category** lines */
    .bubble .md-h4 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .bubble .md-h4:first-child { margin-top: 0; }
    .message.user .bubble .md-h4 { color: rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.2); }

    /* Plain bullet list */
    .bubble ul { list-style: none; padding: 0; margin: 4px 0 6px; }
    .bubble ul:last-child { margin-bottom: 0; }
    .bubble li {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      font-size: 14px;
      line-height: 1.55;
      align-items: baseline;
    }
    .bubble li .li-dot {
      color: var(--muted);
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .message.user .bubble li .li-dot { color: rgba(255,255,255,0.35); }

    /* ── Project / entity chips ── */
    .proj-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 4px 0 6px;
    }
    .proj-list:last-child { margin-bottom: 0; }

    .proj-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
      transition: background 0.1s, border-color 0.1s;
      text-align: left;
      width: 100%;
    }
    .proj-chip:hover  { background: #eae8e4; border-color: #c8c5bf; }
    .proj-chip:active { background: #ddd9d3; }

    .proj-chip .proj-info { flex: 1; min-width: 0; }
    .proj-chip .proj-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .proj-chip .proj-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .proj-chip .proj-arrow {
      color: #c0bdb8;
      font-size: 13px;
      flex-shrink: 0;
      font-weight: 300;
    }
    .proj-chip:hover .proj-arrow { color: var(--muted); }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
      max-width: 100%;
    }
    .quick-action {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.25;
      transition: background 0.12s, border-color 0.12s;
    }
    .quick-action:hover { background: var(--border); border-color: #c8c5bf; }
    .quick-action:active { background: #ddd9d3; }

    /* ── Timestamp ── */
    .ts {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 3px;
      opacity: 0.7;
    }

    /* ── Typing indicator ── */
    #typing {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      margin: 2px 18px 6px;
      animation: fadeIn 0.14s ease;
    }
    #typing.hidden { display: none; }
    #typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    #typing span:nth-child(2) { animation-delay: 0.18s; }
    #typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    #input {
      flex: 1;
      min-width: 0;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 14.5px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #aaa; }
    #input::placeholder { color: var(--muted); }
    #send {
      padding: 10px 20px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send:hover:not(:disabled) { opacity: 0.75; }
    #send:disabled { opacity: 0.28; cursor: default; }

    /* ── Welcome ── */
    .welcome { text-align: center; padding: 32px 16px 16px; }
    .welcome h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
    .welcome p  { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .chips-row  { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .sug-chip {
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      background: var(--surface);
      cursor: pointer;
      transition: background 0.1s;
    }
    .sug-chip:hover { background: var(--border); }

    /* Scrollbar */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 640px) {
      :root { --radius: 18px; }

      #app {
        max-width: none;
      }

      header {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "logo subtitle status"
          "langs langs langs";
        align-items: center;
        row-gap: 8px;
        column-gap: 9px;
        padding: calc(8px + env(safe-area-inset-top)) 12px 9px;
      }

      .logo {
        grid-area: logo;
        font-size: 22px;
        line-height: 1;
        letter-spacing: 0.055em;
      }

      .header-sub {
        grid-area: subtitle;
        font-size: 11px;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status-dot {
        grid-area: status;
        margin-left: 0;
      }

      .lang-selector {
        grid-area: langs;
        margin-left: 0;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        min-width: 0;
        width: 100%;
      }

      .lang-btn {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 0 6px;
        border-radius: 13px;
        font-size: 12px;
        line-height: 1;
        touch-action: manipulation;
      }

      #messages {
        padding: 16px 12px 10px;
        gap: 2px;
      }

      .message {
        max-width: 92%;
      }

      .message.user {
        margin-top: 8px;
      }

      .message.bot + .message.user,
      .message.user + .message.bot {
        margin-top: 12px;
      }

      .bubble {
        padding: 11px 13px;
        font-size: 15px;
        line-height: 1.5;
      }

      .message.bot .bubble {
        max-width: 100%;
      }

      .ts {
        font-size: 11px;
        margin-top: 4px;
      }

      #typing {
        margin: 2px 12px 6px;
        padding: 10px 14px;
      }

      #input-bar {
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }

      #input {
        width: 0;
        height: 44px;
        padding: 0 14px;
        font-size: 16px;
      }

      #send {
        min-width: 74px;
        height: 44px;
        padding: 0 18px;
        font-size: 15px;
      }

      .quick-actions {
        gap: 7px;
        margin-top: 8px;
      }

      .quick-action {
        min-height: 38px;
        padding: 8px 13px;
        font-size: 14px;
      }

      .proj-chip {
        padding: 10px 11px;
      }
    }

    @media (max-width: 360px) {
      .logo { font-size: 20px; }
      .header-sub { font-size: 10.5px; }
      .lang-selector { gap: 4px; }
      .lang-btn { min-height: 32px; font-size: 11px; }
      #send { min-width: 66px; padding: 0 14px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">1PAX</span>
    <span class="header-sub">Assistant · internal preview</span>
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="">EN</button>
      <button class="lang-btn" data-lang="FR">FR</button>
      <button class="lang-btn" data-lang="ES">ES</button>
      <button class="lang-btn" data-lang="PT-PT">PT</button>
      <button class="lang-btn" data-lang="ZH-HANS">中文</button>
      <button class="lang-btn" data-lang="SR">SR</button>
    </div>
    <span class="status-dot"></span>
  </header>

  <div id="messages"></div>

  <div id="typing" class="hidden"><span></span><span></span><span></span></div>

  <div id="input-bar">
    <input id="input" type="text" placeholder="Ask about projects, team, services…" autocomplete="off" />
    <button id="send" onclick="handleSend()">Send</button>
  </div>
</div>

<script>
  const RASA_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:5005" : "";

  const SESSION_ID = "u_" + Math.random().toString(36).slice(2, 10);
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("send");
  const typingEl   = document.getElementById("typing");

  const DESKTOP_PLACEHOLDER = "Ask about projects, team, services…";
  const MOBILE_PLACEHOLDER = "Ask 1PAX…";
  function syncInputPlaceholder() {
    inputEl.placeholder = window.matchMedia("(max-width: 640px)").matches
      ? MOBILE_PLACEHOLDER
      : DESKTOP_PLACEHOLDER;
  }
  syncInputPlaceholder();
  window.addEventListener("resize", syncInputPlaceholder);

  // ── Language selection ───────────────────────────────────────────────────────

  // Country → DeepL target code (pre-selects based on IP; user can override)
  const COUNTRY_LANG = {
    FR:"FR", BE:"FR", CH:"FR", MC:"FR", LU:"FR", CI:"FR", SN:"FR", CM:"FR",
    ES:"ES", MX:"ES", AR:"ES", CO:"ES", PE:"ES", CL:"ES", VE:"ES", EC:"ES",
    BO:"ES", PY:"ES", UY:"ES", CR:"ES", PA:"ES", DO:"ES", CU:"ES", GT:"ES",
    PT:"PT-PT", BR:"PT-PT", AO:"PT-PT", MZ:"PT-PT", CV:"PT-PT",
    CN:"ZH-HANS", TW:"ZH-HANS", HK:"ZH-HANS", SG:"ZH-HANS",
    RS:"SR", BA:"SR", ME:"SR",
  };

  const storedLang = localStorage.getItem("pax_lang");
  let currentLang = storedLang && storedLang.toUpperCase().startsWith("EN")
    ? ""
    : (storedLang ?? "");

  function setLang(code) {
    currentLang = code;
    localStorage.setItem("pax_lang", code);
    document.querySelectorAll(".lang-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === code)
    );
  }

  function responseLang() {
    return currentLang || "EN";
  }

  function requestMetadata() {
    const metadata = { lang: responseLang() };
    try {
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (timezone) metadata.timezone = timezone;
    } catch {}
    return metadata;
  }

  // Apply stored preference immediately
  setLang(currentLang);

  document.querySelectorAll(".lang-btn").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang))
  );

  // Pre-select from IP geolocation (only if user hasn't chosen before)
  // Then fire the opening greeting once language is known.
  let _greetingSent = false;
  function maybeGreet() {
    if (_greetingSent) return;
    _greetingSent = true;
    sendGreeting(currentLang);
  }

  function detectLanguageAndGreet() {
    if (localStorage.getItem("pax_lang") !== null || typeof fetch !== "function") {
      maybeGreet();
      return;
    }

    const timeoutOptions =
      typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function"
        ? { signal: AbortSignal.timeout(3000) }
        : {};

    fetch("https://ipapi.co/json/", timeoutOptions)
      .then(r => r.json())
      .then(d => { const l = COUNTRY_LANG[d.country_code]; if (l) setLang(l); })
      .catch(() => {})
      .finally(() => maybeGreet());
  }

  // ── Markdown renderer ────────────────────────────────────────────────────────

  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escAttr(s) {
    return esc(s).replace(/"/g, "&quot;");
  }
  function decodeEnt(s) {
    return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  }

  const PROJECT_QUERY_TEMPLATES = {
    EN: name => `Tell me about ${name}`,
    FR: name => `Parlez-moi de ${name}`,
    ES: name => `Háblame de ${name}`,
    PT: name => `Fale-me sobre ${name}`,
    "PT-PT": name => `Fale-me sobre ${name}`,
    ZH: name => `请介绍一下${name}`,
    "ZH-HANS": name => `请介绍一下${name}`,
    SR: name => `Recite mi nešto o ${name}`,
  };

  function projectQueryText(projectName) {
    const lang = (currentLang || "EN").toUpperCase();
    const baseLang = lang.split("-")[0];
    const template = PROJECT_QUERY_TEMPLATES[lang] || PROJECT_QUERY_TEMPLATES[baseLang] || PROJECT_QUERY_TEMPLATES.EN;
    return template(projectName);
  }

  function inlineMd(s) {
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/_([^_\n]+)_/g, "<em>$1</em>");
    s = s.replace(/(?<!\*)\*(?!\*)([^*\n]+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  // A bullet item is a clickable project chip if it has **Name** — Meta with parens
  // (all location/year metas have parens; feature descriptions like "resting points..." don't)
  function parseChip(raw) {
    const m = raw.match(/^<strong>(.+?)<\/strong>\s*[—\-]\s*(.+)$/);
    if (!m || !m[2].includes("(")) return null;
    return { name: m[1], meta: m[2] };
  }

  function renderMarkdown(raw) {
    const lines = esc(raw).split("\n");
    const blocks = [];
    let listBuf = []; // {chip: {name,meta}|null, html: string}

    function flushList() {
      if (!listBuf.length) return;

      const hasChips = listBuf.some(i => i.chip);

      if (hasChips) {
        // All items render as interactive chip cards
        const inner = listBuf.map(item => {
          if (item.chip) {
            const projectName = escAttr(decodeEnt(item.chip.name));
            return `<button class="proj-chip" data-project="${projectName}">
              <div class="proj-info">
                <div class="proj-name">${item.chip.name}</div>
                <div class="proj-meta">${item.chip.meta}</div>
              </div>
              <span class="proj-arrow">›</span>
            </button>`;
          }
          // Non-chip item mixed in (rare) — plain li style
          return `<div style="display:flex;gap:8px;padding:3px 2px;font-size:14px">
            <span style="color:var(--muted);font-size:10px;margin-top:3px">●</span>
            <span>${item.html}</span></div>`;
        }).join("");
        blocks.push(`<div class="proj-list">${inner}</div>`);
      } else {
        // Regular bullet list
        const items = listBuf.map(i =>
          `<li><span class="li-dot">●</span><span>${i.html}</span></li>`).join("");
        blocks.push(`<ul>${items}</ul>`);
      }
      listBuf = [];
    }

    for (const rawLine of lines) {
      const line = rawLine.replace(/^\s+/, ""); // strip indent

      if (line.trim() === "") { flushList(); continue; }

      const bullet = line.match(/^[•\-\*]\s+(.+)/);
      if (bullet) {
        const html = inlineMd(bullet[1]);
        listBuf.push({ chip: parseChip(html), html });
        continue;
      }

      flushList();
      const t = line.trim();

      // Standalone **heading** (nothing else on the line)
      const hdg = t.match(/^\*\*([^*]+?)\*\*:?\s*$/);
      if (hdg) {
        blocks.push(`<div class="md-h4">${hdg[1]}</div>`);
        continue;
      }

      blocks.push(`<p>${inlineMd(t)}</p>`);
    }
    flushList();

    // Merge adjacent <p> blocks into one paragraph with <br>
    const out = [];
    let pBuf = [];
    for (const b of blocks) {
      if (b.startsWith("<p>") && b.endsWith("</p>")) {
        pBuf.push(b.slice(3, -4));
      } else {
        if (pBuf.length) { out.push(`<p>${pBuf.join("<br>")}</p>`); pBuf = []; }
        out.push(b);
      }
    }
    if (pBuf.length) out.push(`<p>${pBuf.join("<br>")}</p>`);

    return out.join("");
  }

  // ── Chip click (event delegation) ───────────────────────────────────────────
  messagesEl.addEventListener("click", e => {
    const action = e.target.closest(".quick-action");
    if (action) {
      const label = action.dataset.label || action.textContent.trim();
      const payload = action.dataset.payload || "";
      if (payload) {
        send(label, 0, payload);
      } else {
        send(label);
      }
      return;
    }

    const chip = e.target.closest(".proj-chip");
    if (!chip) return;
    if (chip.dataset.project) {
      send(projectQueryText(decodeEnt(chip.dataset.project)));
    } else if (chip.dataset.q) {
      send(decodeEnt(chip.dataset.q));
    }
  });

  // ── UI helpers ───────────────────────────────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function safeHttpUrl(url) {
    if (!url || typeof url !== "string") return "";
    try {
      const parsed = new URL(url, window.location.href);
      return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : "";
    } catch {
      return "";
    }
  }

  function appendMedia(bubble, media = {}) {
    const imageUrl = safeHttpUrl(media.image);
    if (!imageUrl) return;

    const img = document.createElement("img");
    img.className = "bubble-image";
    img.src = imageUrl;
    img.alt = "Project cover";
    img.loading = "lazy";
    img.decoding = "async";
    bubble.appendChild(img);
  }

  function appendQuickActions(wrapper, actions = []) {
    if (!Array.isArray(actions) || !actions.length) return;

    const row = document.createElement("div");
    row.className = "quick-actions";

    for (const action of actions) {
      const title = (action?.title || action?.text || "").trim();
      if (!title) continue;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "quick-action";
      button.textContent = title;
      button.dataset.label = title;
      if (action.payload) button.dataset.payload = action.payload;
      row.appendChild(button);
    }

    if (row.children.length) wrapper.appendChild(row);
  }

  function appendMessage(role, text = "", media = {}, actions = []) {
    document.getElementById("welcome")?.remove();
    const wrap   = document.createElement("div");
    wrap.className = `message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = text ? renderMarkdown(text) : "";
    appendMedia(bubble, media);
    const ts = document.createElement("div");
    ts.className = "ts";
    ts.textContent = now();
    wrap.appendChild(bubble);
    if (role === "bot") appendQuickActions(wrap, actions);
    wrap.appendChild(ts);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
    typingEl.classList.toggle("hidden", !on);
    if (on) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Input translation (→ English for Rasa NLU) ──────────────────────────────
  // Local dev: call translation server directly on port 5056 (CORS enabled).
  // Production (nginx): proxied via /api/translate.
  const TRANSLATE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:5056/translate"
    : "/api/translate";

  // DeepL target codes use regional variants (PT-PT, ZH-HANS); source codes use base language
  const TARGET_TO_SOURCE = { "PT-PT": "PT", "PT-BR": "PT", "ZH-HANS": "ZH", "ZH-HANT": "ZH" };

  async function translateToEnglish(text, lang) {
    if (!lang || lang.toUpperCase().startsWith("EN")) return text;
    const sourceLang = TARGET_TO_SOURCE[lang] || lang;
    try {
      const r = await fetch(TRANSLATE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, source_lang: sourceLang }),
      });
      const d = await r.json();
      return d.text || text;
    } catch {
      return text;  // translation server unavailable — send as-is
    }
  }

  // ── Bot-initiated greeting ────────────────────────────────────────────────────
  async function sendGreeting(lang) {
    typingEl.classList.remove("hidden");
    messagesEl.scrollTop = messagesEl.scrollHeight;
    try {
      const res = await fetch(`${RASA_URL}/webhooks/rest/webhook`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender: SESSION_ID,
          message: "hello",
          metadata: requestMetadata(),
        }),
      });
      typingEl.classList.add("hidden");
      if (res.ok) {
        const replies = await res.json();
        for (const r of replies) {
          if (r.text || r.image || r.buttons?.length) {
            appendMessage("bot", r.text || "", { image: r.image }, r.buttons || []);
          }
        }
      }
    } catch {
      typingEl.classList.add("hidden");
    }
    inputEl.focus();
  }

  // ── Send ─────────────────────────────────────────────────────────────────────
  async function send(text, _retries = 0, _cachedEnglish = null) {
    const msg = (text || inputEl.value).trim();
    if (!msg) return;
    if (_retries === 0) {
      inputEl.value = "";
      appendMessage("user", msg);
    }
    setLoading(true);

    // Translate input to English once; reuse on retries to avoid redundant API calls
    const englishMsg = _cachedEnglish ?? await translateToEnglish(msg, currentLang);

    try {
      const res = await fetch(`${RASA_URL}/webhooks/rest/webhook`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender: SESSION_ID,
          message: englishMsg,
          metadata: requestMetadata(),
        }),
      });

      if (res.status === 502 || res.status === 503) {
        setLoading(false);
        if (_retries === 0) appendMessage("bot", "⏳ Assistant is loading — this takes about a minute on first start. Retrying…");
        if (_retries < 24) {
          if (_retries > 0 && _retries % 4 === 0)
            appendMessage("bot", `⏳ Still loading… (~${Math.round((24 - _retries) * 5)}s remaining)`);
          setTimeout(() => send(msg, _retries + 1, englishMsg), 5000);
        } else {
          appendMessage("bot", "⚠️ Assistant took too long to start. Please refresh and try again.");
        }
        return;
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const replies = await res.json();
      setLoading(false);
      if (!replies?.length) {
        appendMessage("bot", "I didn't get a response — please try again.");
      } else {
        for (const r of replies) {
          if (r.text || r.image || r.buttons?.length) {
            appendMessage("bot", r.text || "", { image: r.image }, r.buttons || []);
          }
        }
      }
      inputEl.focus();
    } catch (err) {
      setLoading(false);
      appendMessage("bot", "⚠️ Could not reach the assistant. Please check back shortly.");
      console.error(err);
      inputEl.focus();
    }
  }

  function handleSend() { send(); }
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  detectLanguageAndGreet();
  inputEl.focus();
</script>
</body>
