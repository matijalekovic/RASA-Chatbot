<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1PAX — Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f3f1;
      --surface:  #ffffff;
      --border:   #e3e1dc;
      --text:     #111111;
      --muted:    #8a8580;
      --radius:   16px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: flex;
      flex-direction: column;
      max-width: 780px;
      height: 100vh;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 0.07em; }
    .header-sub { font-size: 12px; color: var(--muted); }
    .status-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; margin-left: 8px; flex-shrink: 0; }

    /* ── Language selector ── */
    .lang-selector { display: flex; gap: 3px; margin-left: auto; }
    .lang-btn {
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      transition: all 0.1s;
      line-height: 1.6;
    }
    .lang-btn:hover  { border-color: #aaa; color: var(--text); }
    .lang-btn.active { background: #111; color: #fff; border-color: #111; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      animation: fadeIn 0.14s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; align-items: flex-end; margin-top: 10px; }
    .message.bot  { align-self: flex-start; align-items: flex-start; }
    .message.bot + .message.bot { margin-top: 2px; }
    .message.bot + .message.user,
    .message.user + .message.bot { margin-top: 14px; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #111;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.bot + .message.bot .bubble { border-top-left-radius: 4px; }

    /* ── Markdown — base ── */
    .bubble p { margin: 0 0 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; color: var(--muted); }
    .message.user .bubble em { color: rgba(255,255,255,0.6); }
    .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; opacity: 0.85; }
    .bubble a:hover { opacity: 1; }
    .bubble.has-media { padding: 8px; }
    .bubble.has-media .media-body { padding: 2px 6px 4px; }
    .project-cover {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 9px;
      background: var(--bg);
    }
    .project-cover:last-child { margin-bottom: 0; }

    /* Section headers — standalone **Category** lines */
    .bubble .md-h4 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .bubble .md-h4:first-child { margin-top: 0; }
    .message.user .bubble .md-h4 { color: rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.2); }

    /* Plain bullet list */
    .bubble ul { list-style: none; padding: 0; margin: 4px 0 6px; }
    .bubble ul:last-child { margin-bottom: 0; }
    .bubble li {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      font-size: 14px;
      line-height: 1.55;
      align-items: baseline;
    }
    .bubble li .li-dot {
      color: var(--muted);
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .message.user .bubble li .li-dot { color: rgba(255,255,255,0.35); }

    /* ── Project / entity chips ── */
    .proj-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 4px 0 6px;
    }
    .proj-list:last-child { margin-bottom: 0; }

    .proj-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
      transition: background 0.1s, border-color 0.1s;
      text-align: left;
      width: 100%;
    }
    .proj-chip:hover  { background: #eae8e4; border-color: #c8c5bf; }
    .proj-chip:active { background: #ddd9d3; }

    .proj-chip .proj-info { flex: 1; min-width: 0; }
    .proj-chip .proj-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .proj-chip .proj-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .proj-chip .proj-arrow {
      color: #c0bdb8;
      font-size: 13px;
      flex-shrink: 0;
      font-weight: 300;
    }
    .proj-chip:hover .proj-arrow { color: var(--muted); }

    /* ── Timestamp ── */
    .ts {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 3px;
      opacity: 0.7;
    }

    /* ── Typing indicator ── */
    #typing {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      margin: 2px 18px 6px;
      animation: fadeIn 0.14s ease;
    }
    #typing.hidden { display: none; }
    #typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    #typing span:nth-child(2) { animation-delay: 0.18s; }
    #typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 14.5px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #aaa; }
    #input::placeholder { color: var(--muted); }
    #send {
      padding: 10px 20px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    #send:hover:not(:disabled) { opacity: 0.75; }
    #send:disabled { opacity: 0.28; cursor: default; }

    /* ── Welcome ── */
    .welcome { text-align: center; padding: 32px 16px 16px; }
    .welcome h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
    .welcome p  { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .chips-row  { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .sug-chip {
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      background: var(--surface);
      cursor: pointer;
      transition: background 0.1s;
    }
    .sug-chip:hover { background: var(--border); }

    /* Scrollbar */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">1PAX</span>
    <span class="header-sub">Website assistant</span>
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="">EN</button>
      <button class="lang-btn" data-lang="FR">FR</button>
      <button class="lang-btn" data-lang="ES">ES</button>
      <button class="lang-btn" data-lang="PT-PT">PT</button>
      <button class="lang-btn" data-lang="ZH-HANS">中文</button>
      <button class="lang-btn" data-lang="SR">SR</button>
    </div>
    <span class="status-dot"></span>
  </header>

  <div id="messages"></div>

  <div id="typing" class="hidden"><span></span><span></span><span></span></div>

  <div id="input-bar">
    <input id="input" type="text" placeholder="Ask about projects, team, services…" autocomplete="off" />
    <button id="send" onclick="handleSend()">Send</button>
  </div>
</div>

<script>
  const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
  const CHAT_URL = IS_LOCAL
    ? "http://localhost:5005/webhooks/rest/webhook"
    : "/api/chat";

  const SESSION_ID = "u_" + Math.random().toString(36).slice(2, 10);
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("send");
  const typingEl   = document.getElementById("typing");

  // ── Language selection ───────────────────────────────────────────────────────

  const UI_TEXT = {
    "": {
      htmlLang: "en",
      title: "1PAX — Assistant",
      headerSub: "Website assistant",
      inputPlaceholder: "Ask about projects, team, services...",
      send: "Send",
      online: "Online",
      loading: "Assistant is loading - this takes about a minute on first start. Retrying...",
      stillLoading: ({ seconds }) => `Still loading... (~${seconds}s remaining)`,
      loadTimeout: "Assistant took too long to start. Please refresh and try again.",
      noResponse: "I didn't get a response - please try again.",
      unreachable: "Could not reach the assistant. Please check back shortly.",
    },
    FR: {
      htmlLang: "fr",
      title: "1PAX — Assistant",
      headerSub: "Assistant du site",
      inputPlaceholder: "Posez une question sur les projets, l'équipe, les services...",
      send: "Envoyer",
      online: "En ligne",
      loading: "L'assistant démarre - cela prend environ une minute au premier lancement. Nouvel essai...",
      stillLoading: ({ seconds }) => `Chargement en cours... (~${seconds}s restantes)`,
      loadTimeout: "L'assistant a mis trop de temps à démarrer. Actualisez la page et réessayez.",
      noResponse: "Je n'ai pas reçu de réponse - veuillez réessayer.",
      unreachable: "Impossible de joindre l'assistant. Veuillez réessayer dans un instant.",
    },
    ES: {
      htmlLang: "es",
      title: "1PAX — Asistente",
      headerSub: "Asistente del sitio",
      inputPlaceholder: "Pregunta sobre proyectos, equipo, servicios...",
      send: "Enviar",
      online: "En línea",
      loading: "El asistente se está cargando - tarda aproximadamente un minuto en el primer inicio. Reintentando...",
      stillLoading: ({ seconds }) => `Todavía cargando... (~${seconds}s restantes)`,
      loadTimeout: "El asistente tardó demasiado en iniciar. Actualiza la página e inténtalo de nuevo.",
      noResponse: "No recibí respuesta - inténtalo de nuevo.",
      unreachable: "No se pudo contactar con el asistente. Inténtalo de nuevo en unos momentos.",
    },
    "PT-PT": {
      htmlLang: "pt-PT",
      title: "1PAX — Assistente",
      headerSub: "Assistente do site",
      inputPlaceholder: "Pergunte sobre projetos, equipa, serviços...",
      send: "Enviar",
      online: "Online",
      loading: "O assistente está a carregar - isto demora cerca de um minuto no primeiro arranque. A tentar novamente...",
      stillLoading: ({ seconds }) => `Ainda a carregar... (~${seconds}s restantes)`,
      loadTimeout: "O assistente demorou demasiado a iniciar. Atualize a página e tente novamente.",
      noResponse: "Não recebi resposta - tente novamente.",
      unreachable: "Não foi possível contactar o assistente. Tente novamente dentro de instantes.",
    },
    "ZH-HANS": {
      htmlLang: "zh-Hans",
      title: "1PAX — 助手",
      headerSub: "网站助手",
      inputPlaceholder: "询问项目、团队、服务...",
      send: "发送",
      online: "在线",
      loading: "助手正在加载 - 首次启动大约需要一分钟。正在重试...",
      stillLoading: ({ seconds }) => `仍在加载...（约剩 ${seconds} 秒）`,
      loadTimeout: "助手启动时间过长。请刷新后重试。",
      noResponse: "我没有收到回复 - 请重试。",
      unreachable: "暂时无法连接助手。请稍后再试。",
    },
    SR: {
      htmlLang: "sr-Latn",
      title: "1PAX — Asistent",
      headerSub: "Asistent sajta",
      inputPlaceholder: "Pitajte o projektima, timu, uslugama...",
      send: "Pošalji",
      online: "Online",
      loading: "Asistent se učitava - pri prvom pokretanju to traje oko minut. Pokušavam ponovo...",
      stillLoading: ({ seconds }) => `Još se učitava... (~${seconds}s preostalo)`,
      loadTimeout: "Asistentu je trebalo predugo da se pokrene. Osvežite stranicu i pokušajte ponovo.",
      noResponse: "Nisam dobio odgovor - pokušajte ponovo.",
      unreachable: "Nije moguće povezati se sa asistentom. Pokušajte ponovo uskoro.",
    },
  };

  function uiText(key, vars = {}) {
    const value = (UI_TEXT[currentLang] || UI_TEXT[""])[key] ?? UI_TEXT[""][key];
    return typeof value === "function" ? value(vars) : value;
  }

  function updateStaticText() {
    const copy = UI_TEXT[currentLang] || UI_TEXT[""];
    document.documentElement.lang = copy.htmlLang;
    document.title = copy.title;
    document.querySelector(".header-sub").textContent = copy.headerSub;
    document.querySelector(".status-dot")?.setAttribute("title", copy.online);
    inputEl.placeholder = copy.inputPlaceholder;
    inputEl.setAttribute("aria-label", copy.inputPlaceholder);
    sendBtn.textContent = copy.send;
    sendBtn.setAttribute("aria-label", copy.send);
  }

  // Country → DeepL target code (pre-selects based on IP; user can override)
  const COUNTRY_LANG = {
    FR:"FR", BE:"FR", CH:"FR", MC:"FR", LU:"FR", CI:"FR", SN:"FR", CM:"FR",
    ES:"ES", MX:"ES", AR:"ES", CO:"ES", PE:"ES", CL:"ES", VE:"ES", EC:"ES",
    BO:"ES", PY:"ES", UY:"ES", CR:"ES", PA:"ES", DO:"ES", CU:"ES", GT:"ES",
    PT:"PT-PT", BR:"PT-PT", AO:"PT-PT", MZ:"PT-PT", CV:"PT-PT",
    CN:"ZH-HANS", TW:"ZH-HANS", HK:"ZH-HANS", SG:"ZH-HANS",
    RS:"SR", BA:"SR", ME:"SR",
  };

  let currentLang = localStorage.getItem("pax_lang") ?? "";

  function setLang(code) {
    currentLang = code;
    localStorage.setItem("pax_lang", code);
    document.querySelectorAll(".lang-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === code)
    );
    updateStaticText();
  }
  // Apply stored preference immediately
  setLang(currentLang);

  document.querySelectorAll(".lang-btn").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang))
  );

  // Pre-select from IP geolocation (only if user hasn't chosen before)
  // Then fire the opening greeting once language is known.
  let _greetingSent = false;
  function maybeGreet() {
    if (_greetingSent) return;
    _greetingSent = true;
    sendGreeting(currentLang);
  }

  if (!localStorage.getItem("pax_lang")) {
    fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) })
      .then(r => r.json())
      .then(d => { const l = COUNTRY_LANG[d.country_code]; if (l) setLang(l); })
      .catch(() => {})
      .finally(() => maybeGreet());
  } else {
    maybeGreet();
  }

  // ── Markdown renderer ────────────────────────────────────────────────────────

  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escAttr(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function decodeEnt(s) {
    return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  }

  function inlineMd(s) {
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/_([^_\n]+)_/g, "<em>$1</em>");
    s = s.replace(/(?<!\*)\*(?!\*)([^*\n]+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (_m, label, url) => {
      const isSiteUrl = /^https:\/\/(www\.)?1pax\.com\b/.test(url);
      const target = isSiteUrl ? "_top" : "_blank";
      return `<a href="${url}" target="${target}" rel="noopener">${label}</a>`;
    });
    return s;
  }

  // A bullet item is a clickable project chip if it has **Name** — Meta with parens
  // (all location/year metas have parens; feature descriptions like "resting points..." don't)
  function parseChip(raw) {
    const m = raw.match(/^<strong>(.+?)<\/strong>\s*[—\-]\s*(.+)$/);
    if (!m || !m[2].includes("(")) return null;
    return { name: m[1], meta: m[2] };
  }

  function renderMarkdown(raw) {
    const lines = esc(raw).split("\n");
    const blocks = [];
    let listBuf = []; // {chip: {name,meta}|null, html: string}

    function flushList() {
      if (!listBuf.length) return;

      const hasChips = listBuf.some(i => i.chip);

      if (hasChips) {
        // All items render as interactive chip cards
        const inner = listBuf.map(item => {
          if (item.chip) {
            const query = esc("Tell me about " + decodeEnt(item.chip.name));
            return `<button class="proj-chip" data-q="${query}">
              <div class="proj-info">
                <div class="proj-name">${item.chip.name}</div>
                <div class="proj-meta">${item.chip.meta}</div>
              </div>
              <span class="proj-arrow">›</span>
            </button>`;
          }
          // Non-chip item mixed in (rare) — plain li style
          return `<div style="display:flex;gap:8px;padding:3px 2px;font-size:14px">
            <span style="color:var(--muted);font-size:10px;margin-top:3px">●</span>
            <span>${item.html}</span></div>`;
        }).join("");
        blocks.push(`<div class="proj-list">${inner}</div>`);
      } else {
        // Regular bullet list
        const items = listBuf.map(i =>
          `<li><span class="li-dot">●</span><span>${i.html}</span></li>`).join("");
        blocks.push(`<ul>${items}</ul>`);
      }
      listBuf = [];
    }

    for (const rawLine of lines) {
      const line = rawLine.replace(/^\s+/, ""); // strip indent

      if (line.trim() === "") { flushList(); continue; }

      const bullet = line.match(/^[•\-\*]\s+(.+)/);
      if (bullet) {
        const html = inlineMd(bullet[1]);
        listBuf.push({ chip: parseChip(html), html });
        continue;
      }

      flushList();
      const t = line.trim();

      // Standalone **heading** (nothing else on the line)
      const hdg = t.match(/^\*\*([^*]+?)\*\*:?\s*$/);
      if (hdg) {
        blocks.push(`<div class="md-h4">${hdg[1]}</div>`);
        continue;
      }

      blocks.push(`<p>${inlineMd(t)}</p>`);
    }
    flushList();

    // Merge adjacent <p> blocks into one paragraph with <br>
    const out = [];
    let pBuf = [];
    for (const b of blocks) {
      if (b.startsWith("<p>") && b.endsWith("</p>")) {
        pBuf.push(b.slice(3, -4));
      } else {
        if (pBuf.length) { out.push(`<p>${pBuf.join("<br>")}</p>`); pBuf = []; }
        out.push(b);
      }
    }
    if (pBuf.length) out.push(`<p>${pBuf.join("<br>")}</p>`);

    return out.join("");
  }

  // ── Chip click (event delegation) ───────────────────────────────────────────
  messagesEl.addEventListener("click", e => {
    const chip = e.target.closest(".proj-chip");
    if (chip && chip.dataset.q) send(decodeEnt(chip.dataset.q));
  });

  // ── UI helpers ───────────────────────────────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function appendMessage(role, text, imageUrl = "") {
    document.getElementById("welcome")?.remove();
    const wrap   = document.createElement("div");
    wrap.className = `message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = `bubble${imageUrl ? " has-media" : ""}`;
    const mediaHtml = imageUrl
      ? `<img class="project-cover" src="${escAttr(imageUrl)}" alt="Project cover image" loading="lazy">`
      : "";
    const textHtml = text ? renderMarkdown(text) : "";
    bubble.innerHTML = imageUrl && textHtml
      ? `${mediaHtml}<div class="media-body">${textHtml}</div>`
      : `${mediaHtml}${textHtml}`;
    const ts = document.createElement("div");
    ts.className = "ts";
    ts.textContent = now();
    wrap.appendChild(bubble);
    wrap.appendChild(ts);
    messagesEl.appendChild(wrap);
    bubble.querySelector(".project-cover")?.addEventListener("load", () => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, { once: true });
    bubble.querySelector(".project-cover")?.addEventListener("error", event => {
      event.currentTarget.remove();
    }, { once: true });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendBotReply(reply) {
    if (reply.text || reply.image) appendMessage("bot", reply.text || "", reply.image || "");
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
    typingEl.classList.toggle("hidden", !on);
    if (on) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Input translation (→ English for Rasa NLU) ──────────────────────────────
  // Local dev: call translation server directly on port 5056 (CORS enabled).
  // Production (nginx): proxied via /api/translate.
  const TRANSLATE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:5056/translate"
    : "/api/translate";

  // DeepL target codes use regional variants (PT-PT, ZH-HANS); source codes use base language
  const TARGET_TO_SOURCE = { "PT-PT": "PT", "PT-BR": "PT", "ZH-HANS": "ZH", "ZH-HANT": "ZH" };

  async function translateToEnglish(text, lang) {
    if (!lang) return text;  // already English
    const sourceLang = TARGET_TO_SOURCE[lang] || lang;
    try {
      const r = await fetch(TRANSLATE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, source_lang: sourceLang }),
      });
      const d = await r.json();
      return d.text || text;
    } catch {
      return text;  // translation server unavailable — send as-is
    }
  }

  // ── Bot-initiated greeting ────────────────────────────────────────────────────
  async function sendGreeting(lang) {
    typingEl.classList.remove("hidden");
    messagesEl.scrollTop = messagesEl.scrollHeight;
    try {
      const res = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender: SESSION_ID,
          message: "hello",
          ...(lang ? { metadata: { lang } } : {}),
        }),
      });
      typingEl.classList.add("hidden");
      if (res.ok) {
        const replies = await res.json();
        for (const r of replies) appendBotReply(r);
      }
    } catch {
      typingEl.classList.add("hidden");
    }
    inputEl.focus();
  }

  // ── Send ─────────────────────────────────────────────────────────────────────
  async function send(text, _retries = 0, _cachedEnglish = null) {
    const msg = (text || inputEl.value).trim();
    if (!msg) return;
    if (_retries === 0) {
      inputEl.value = "";
      appendMessage("user", msg);
    }
    setLoading(true);

    // Translate input to English once; reuse on retries to avoid redundant API calls
    const englishMsg = _cachedEnglish ?? await translateToEnglish(msg, currentLang);

    try {
      const res = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender: SESSION_ID,
          message: englishMsg,
          ...(currentLang ? { metadata: { lang: currentLang } } : {}),
        }),
      });

      if (res.status === 502 || res.status === 503) {
        setLoading(false);
        if (_retries === 0) appendMessage("bot", uiText("loading"));
        if (_retries < 24) {
          if (_retries > 0 && _retries % 4 === 0)
            appendMessage("bot", uiText("stillLoading", { seconds: Math.round((24 - _retries) * 5) }));
          setTimeout(() => send(msg, _retries + 1, englishMsg), 5000);
        } else {
          appendMessage("bot", uiText("loadTimeout"));
        }
        return;
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const replies = await res.json();
      setLoading(false);
      if (!replies?.length) {
        appendMessage("bot", uiText("noResponse"));
      } else {
        for (const r of replies) appendBotReply(r);
      }
      inputEl.focus();
    } catch (err) {
      setLoading(false);
      appendMessage("bot", uiText("unreachable"));
      console.error(err);
      inputEl.focus();
    }
  }

  function handleSend() { send(); }
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.focus();
</script>
</body>
</html>
