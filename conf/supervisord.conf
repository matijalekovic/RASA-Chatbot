[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:actions]
command=rasa run actions --port 5055
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/actions.log
stderr_logfile=/tmp/actions.log

[program:rasa]
command=rasa run --enable-api --cors "*" --port 5005 --endpoints endpoints.yml
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/tmp/rasa.log
stderr_logfile=/tmp/rasa.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.log
