server {
    listen NGINX_PORT;

    # Serve the chat UI
    root /app/ui;
    index index.html;

    # Proxy Rasa API (webhooks, status)
    location /webhooks/ {
        proxy_pass http://localhost:5005;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /status {
        proxy_pass http://localhost:5005;
    }

    # Fallback to UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}
