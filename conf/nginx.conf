server {
    listen NGINX_PORT;

    # Serve the chat UI
    root /app/ui;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /api/chat {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        proxy_pass http://localhost:5005/webhooks/rest/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/status {
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://localhost:5005/status;
        proxy_set_header Host $host;
    }

    # Proxy Rasa API (webhooks, status)
    location /webhooks/ {
        proxy_pass http://localhost:5005;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /status {
        proxy_pass http://localhost:5005;
    }
    location /model/parse {
        proxy_pass http://localhost:5005;
    }
    location /conversations/ {
        proxy_pass http://localhost:5005;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # MCP QA server for remote chatbot probing and workflow validation.
    location = /mcp {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, MCP-Protocol-Version" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, MCP-Protocol-Version" always;

        proxy_pass http://localhost:5057/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /mcp/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, MCP-Protocol-Version" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, MCP-Protocol-Version" always;

        proxy_pass http://localhost:5057/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /mcp/health {
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://localhost:5057/health;
        proxy_set_header Host $host;
    }

    # Translation proxy — UI calls this to translate input to English before sending to Rasa
    location = /api/translate {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        proxy_pass http://localhost:5056/translate;
        proxy_set_header Host $host;
    }
    location = /api/translate/health {
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://localhost:5056/health;
        proxy_set_header Host $host;
    }

    # Fallback to UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}
