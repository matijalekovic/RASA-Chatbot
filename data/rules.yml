version: "3.1"

rules:

# ── Core conversation ────────────────────────────────────────────────────────

- rule: Greet the user
  steps:
    - intent: greet
    - action: action_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: action_goodbye

- rule: Respond to bot challenge
  steps:
    - intent: bot_challenge
    - action: action_iamabot

- rule: Handle out of scope questions
  steps:
    - intent: out_of_scope
    - action: action_handle_out_of_scope

- rule: NLU fallback
  steps:
    - intent: nlu_fallback
    - action: action_handle_out_of_scope

# ── Project discovery ────────────────────────────────────────────────────────

- rule: List all projects
